<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>
        Sistema de Receitas
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="./css/style.css">

</head>

<body>

<div class="container mt-4">

    <h1 class="mb-4">
        🍳 Sistema de Receitas
    </h1>

    <div class="row">

        <!-- RECEITAS -->

        <div class="col-md-6 mb-4">

            <div class="card">

                <div class="card-header">
                    Nova Receita
                </div>

                <div class="card-body">

                    <form id="form-receita">

                        <input
                            id="receita-nome"
                            class="form-control mb-2"
                            placeholder="Nome da Receita">

                        <button
                            class="btn btn-success">

                            Salvar
                        </button>

                    </form>

                </div>

                <ul
                    id="lista-receitas"
                    class="list-group list-group-flush">
                </ul>

            </div>

        </div>

        <!-- CATEGORIAS -->

        <div class="col-md-6 mb-4">

            <div class="card">

                <div class="card-header">
                    Categorias
                </div>

                <div class="card-body">

                    <form id="form-categoria">

                        <input
                            id="categoria-nome"
                            class="form-control mb-2"
                            placeholder="Nome da Categoria">

                        <button
                            class="btn btn-primary">

                            Salvar
                        </button>

                    </form>

                </div>

                <ul
                    id="lista-categorias"
                    class="list-group list-group-flush">
                </ul>

            </div>

        </div>

        <!-- INGREDIENTES -->

        <div class="col-md-6 mb-4">

            <div class="card">

                <div class="card-header">
                    Ingredientes
                </div>

                <div class="card-body">

                    <form id="form-ingrediente">

                        <input
                            id="ingrediente-nome"
                            class="form-control mb-2"
                            placeholder="Nome">

                        <input
                            id="ingrediente-quantidade"
                            class="form-control mb-2"
                            placeholder="Quantidade">

                        <button
                            class="btn btn-warning">

                            Salvar
                        </button>

                    </form>

                </div>

                <ul
                    id="lista-ingredientes"
                    class="list-group list-group-flush">
                </ul>

            </div>

        </div>

        <!-- COMENTÁRIOS -->

        <div class="col-md-6 mb-4">

            <div class="card">

                <div class="card-header">
                    Comentários
                </div>

                <div class="card-body">

                    <form id="form-comentario">

                        <input
                            id="comentario-texto"
                            class="form-control mb-2"
                            placeholder="Comentário">

                        <button
                            class="btn btn-secondary">

                            Salvar
                        </button>

                    </form>

                </div>

                <ul
                    id="lista-comentarios"
                    class="list-group list-group-flush">
                </ul>

            </div>

        </div>

    </div>

</div>

<script
    type="module"
    src="./js/main.js">
</script>

</body>
</html>
